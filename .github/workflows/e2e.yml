name: e2e

# Full end-to-end set (without maps) on every PR: this branch plus main of the other three applications.
# The logic lives in xmenu-e2e (.github/actions), this file only wires it up.
on:
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  E2E_REF: ci/e2e-on-app-prs

jobs:
  contract:
    name: e2e contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Muxammadaziz04/xmenu-e2e
          ref: ${{ env.E2E_REF }}
          token: ${{ secrets.E2E_REPOS_TOKEN }}
      - uses: ./.github/actions/contract
        with:
          token: ${{ secrets.E2E_REPOS_TOKEN }}
          backend_ref: ${{ github.event.pull_request.head.sha }}
          backend_repo: ${{ github.repository }}

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_REPOS_DIR: repos
      E2E_PG_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      E2E_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Muxammadaziz04/xmenu-e2e
          ref: ${{ env.E2E_REF }}
          token: ${{ secrets.E2E_REPOS_TOKEN }}
      - uses: ./.github/actions/run
        with:
          token: ${{ secrets.E2E_REPOS_TOKEN }}
          backend_ref: ${{ github.event.pull_request.head.sha }}
          backend_repo: ${{ github.repository }}
